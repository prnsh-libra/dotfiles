setupVersion: 2
theme:
  dark: dark-lunar
  light: dark-lunar
symbolPreset: nerd
statusLine:
  preset: compact
  separator: powerline-thin
  compactThinkingLevel: true
  transparent: true
  showHookStatus: true
  sessionAccent: true
  contextLine: embedded
terminal:
  showProgress: true
display:
  smoothStreaming: true
  shimmer: classic
  showTokenUsage: true
steeringMode: one-at-a-time
loop:
  mode: prompt
tools:
  approvalMode: yolo
  format: auto
power:
  sleepPrevention: idle
compaction:
  handoffSaveToDisk: false
edit:
  mode: hashline
readLineNumbers: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
bash:
  enabled: true
github:
  enabled: true
browser:
  cmux: false
  headless: true
providers:
  autoThinkingMaxEffort: xhigh
modelRoles:
  smol: openai-codex/gpt-5.6-luna:medium
  slow: openai-codex/gpt-5.6-sol:xhigh
  vision: openai-codex/gpt-5.6-terra:high
  plan: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-5.6-sol:xhigh
  commit: openai-codex/gpt-5.6-luna:low
  task: anthropic/claude-sonnet-4-6:high
  advisor: openai-codex/gpt-5.6-sol:medium
  tiny: anthropic/claude-opus-4-8:low
  default: anthropic/claude-opus-4-8:high
advisor:
  enabled: true
contextPromotion:
  enabled: true
hideThinkingBlock: true
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
retry:
  fallbackChains:
    {}
plan:
  enabled: false
title:
  refreshOnReplan: false
model:
  loopGuard:
    toolCallReminder: true
colorBlindMode: true
tui:
  textSizing: false
  hyperlinks: always
  tight: true
task:
  agentModelOverrides:
    task: anthropic/claude-opus-4-8:high
  agentAdvisor:
    task: "on"
cycleOrder:
  - smol
  - slow
  - default
composer:
  shape: box
doubleEscapeAction: tree
extendedContext: true
followUpMode: one-at-a-time
autoResume: false
astGrep:
  enabled: true
checkpoint:
  enabled: true