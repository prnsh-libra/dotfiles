;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; 
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-scroll = false

format = <label-state>
format-background = #67000000
format-padding = 0

; Active workspace — slightly wider glyph
label-focused = 
label-focused-foreground = #e0e0e0
label-focused-padding = 1
label-focused-font = 3

; Occupied workspace — mid gray
label-occupied = 
label-occupied-foreground = #9a9a9a
label-occupied-padding = 1
label-occupied-font = 3

; Empty workspace — dim gray
label-empty = 
label-empty-foreground = #4a4a4a
label-empty-padding = 1
label-empty-font = 3

; Urgent — light gray (still grayscale)
label-urgent = 
label-urgent-foreground = #c8c8c8
label-urgent-padding = 1
label-urgent-font = 3

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/caffeine_date.sh
interval = 1
format-background = #67000000
format-padding = 6
click-left = ~/.config/polybar/scripts/caffeine_toggle.sh

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/alsa]
type = internal/alsa

interval = 1
master-mixer = Master
use-ui-max = true

format-volume = <ramp-volume> <label-volume>
format-muted  = <label-muted>
format-volume-background = #67000000
format-muted-background = #67000000
format-volume-padding = 1
format-muted-padding = 1

label-volume = %percentage%%
label-volume-foreground = #d0d0d0

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = #d0d0d0
ramp-volume-padding = 1

label-muted =  0%
label-muted-foreground = #5a5a5a

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/network]
type = internal/network
interface = wlp2s0
interval = 3

format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
format-connected-background = #67000000
format-disconnected-background = #67000000
format-connected-padding = 1
format-disconnected-padding = 1

label-connected = %essid%
label-connected-foreground = #d0d0d0

label-disconnected = 󰤭
label-disconnected-foreground = #5a5a5a

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = #d0d0d0
ramp-signal-padding = 1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-charging-background = #67000000
format-discharging-background = #67000000
format-full-background = #67000000
format-charging-padding = 1
format-discharging-padding = 1
format-full-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full =  100%

label-charging-foreground = #d0d0d0
label-discharging-foreground = #d0d0d0
label-full-foreground = #d0d0d0

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = #d0d0d0
ramp-capacity-padding = 1

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = #d0d0d0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 600
format-background = #67000000
format-padding = 0
format = <label>
label = %output%

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/system_pill]
type = custom/script
exec = ~/.config/polybar/scripts/system_pill.sh
interval = 2
format-background = #67000000
format-padding = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/status_pill]
type = custom/script
exec = ~/.config/polybar/scripts/status_pill.sh
tail = true
format-background = #67000000
format-padding = 0
format = <label>
label = %output%
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/claude]
type = custom/script
exec = ~/.config/polybar/scripts/claude.sh
tail = true
format = <label>
label = %output%
format-background = #67000000
format-padding = 0
format-prefix = ""
format-prefix-foreground = #67000000
format-prefix-background = #00000000
format-prefix-font = 2
format-suffix = " "
format-suffix-foreground = #67000000
format-suffix-background = #00000000
format-suffix-font = 2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
tail = true
format = <label>
label = %output%
format-background = #67000000
format-padding = 0
format-prefix = " "
format-prefix-foreground = #67000000
format-prefix-background = #00000000
format-prefix-font = 2
format-suffix = 
format-suffix-foreground = #67000000
format-suffix-background = #00000000
format-suffix-font = 2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/tray]
type = internal/tray
format = <tray>
format-background = #67000000
format-padding = 0
format-prefix = 
format-prefix-foreground = #67000000
format-prefix-background = #00000000
format-prefix-font = 2
format-suffix = 
format-suffix-foreground = #67000000
format-suffix-background = #00000000
format-suffix-font = 2
tray-spacing = 6px
tray-padding = 6px
tray-size = 66%

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/gap]
type = custom/text
format = "  "
content-background = #00000000

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/cap-left]
type = custom/text
format = <label>
label = 
label-foreground = #67000000
label-background = #00000000
label-font = 2
label-padding = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/cap-right]
type = custom/text
format = <label>
label = 
label-foreground = #67000000
label-background = #00000000
label-font = 2
label-padding = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/ind-weather]
type = custom/script
exec = ~/.config/polybar/scripts/indicator_weather.sh
interval = 5

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/ind-system]
type = custom/script
exec = ~/.config/polybar/scripts/indicator_system.sh
interval = 5

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/ind-status]
type = custom/script
exec = ~/.config/polybar/scripts/indicator_status.sh
interval = 1
